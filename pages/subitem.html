<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha técnica | Cómputo y Presupuesto</title>
    <link rel="stylesheet" href="../CSS/subitem.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="../javascript/subitem.js"></script>
</head>
<body>
<header class="header">
    <a href="../index.html" class="back-link">← Volver al inicio</a>
    <h1>CÓMPUTO Y PRESUPUESTO</h1>
</header>
<main class="container">
    <div class="page-heading">
    <div>
        <h2>Ficha técnica del subítem</h2>
        <p>
            Información e insumos del subitem.Materiales, mano de obra y equipos.
        </p>
    </div>
    <div class="estado-container">
        <span id="estado" class="estado"></span>
    </div>
</div>
    <!-- IDENTIFICACIÓN -->
    <section class="panel panel-identificacion">
        <h3>01. Identificación del subítem</h3>
        <div class="form-grid">
            <div>
                <label>ID</label>
                <p id="id" class="dato-fijo"></p>
            </div>
            <div>
                <label>Unidad</label>
                <p id="unidad" class="dato-fijo"></p>
            </div>
            <div class="campo-descripcion">
                <label>Descripción</label>
                <p id="descripcion" class="dato-fijo"></p>
            </div>
        </div>
    </section>
    <!-- 02. MATERIALES -->
    <section class="panel panel-recursos panel-materiales">
        <h3>02. Materiales</h3>
        <div id="tabla-materiales"></div>
    </section>
    <!-- 03. MANO DE OBRA -->
    <section class="panel panel-recursos panel-mano-obra">
        <h3>03. Mano de obra</h3>
        <div id="tabla-mano-obra"></div>
    </section>
    <!-- 04. EQUIPOS -->
    <section class="panel panel-recursos panel-equipos">
        <h3>04. Equipos</h3>
        <div id="tabla-equipos"></div>
    </section>
    <!--ANALISIS DE PRECIO UNITARIO-->
    <section class="panel panel-apu">
        <h3>05. Analisis de precio unitario</h3>
        <div id="tabla-apu"></div>
    </section>
    <!-- INFORMACIÓN COMPLEMENTARIA -->
    <section class="panel panel-complementaria">
        <h3>06. Información complementaria</h3>
        <label>Descripción ampliada:
            <p id="descripcion-ampliada"></p>
        </label>
        <label>Observaciones:
            <p id="observaciones"></p>
        </label>
    </section>
    <!-- ACCIONES -->
    <section class="actions">
</main>
</body>
</html>
