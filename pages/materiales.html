<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de materiales | Cómputo y Presupuesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

<body>
    <header class="encabezado-materiales">
        <div class="contenedor-materiales">

            </a>
            <h1>Biblioteca de materiales</h1>
            <p>

        </div>

    <main class="contenedor-materiales">

                </div>
                <span id="cantidad-materiales"></span>
            </div>
            <div class="buscador-materiales">
                <input type="search" id="buscar-material" placeholder="Buscar material..." autocomplete="off"

            <div id="lista-agrupaciones"></div>
        </section>
    </main>
    <script type="module" src="../javascript/materiales.js"></script>
